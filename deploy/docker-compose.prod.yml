version: '3.9'

services:
  frontend:
    image: imi2026/frontend:latest
    restart: unless-stopped
    ports:
      - "80:5173"
    depends_on:
      - backend

  backend:
    image: imi2026/backend:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: imi2026
      MYSQL_USER: imi
      MYSQL_PASSWORD: imi
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  mysql_data:
